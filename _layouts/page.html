{% assign data = site.data.data %}

<!DOCTYPE html>
<html lang="{{ page.lang }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ data.home.title.[page.lang] }}</title>

    <base href="/uptest.no/">
    
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="fonts.css">
    
    {% include tailwind.html %}
    
</head>
<body class="bg-white text-slate-800 antialiased font-sans flex flex-col min-h-[100svh]">

    <!-- Įtraukiamas headeris -->
    {% include header.html %}

    <!-- Subpage Hero / Pavadinimo Blokas su Nuotraukos Fonu -->
    <section class="relative bg-brand-950 py-16 lg:py-24 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="{{ page.header_image | default: 'images/header-uptest.jpg' }}" class="w-full h-full object-cover object-center opacity-65" alt="{{ page.title }}">
            <div class="absolute inset-0 bg-gradient-to-r from-brand-950/70 via-brand-950/50 to-brand-950/70"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-950 via-transparent to-brand-950/40"></div>
        </div>

        <div class="relative z-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                {{ page.title }}
            </h1>
        </div>
    </section>

    <!-- Pagrindinio teksto sekcija -->
    <main class="flex-grow bg-white py-12 lg:py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 text-slate-700 leading-relaxed">
            {{ content }}
        </div>
    </main>


    <!-- Footeris -->
    <footer class="bg-zinc-100 py-4 sm:py-5 border-t border-gray-200 relative z-30 shadow-sm mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-4 text-center sm:text-left">
            
            <p class="text-[11px] text-slate-600 font-normal">
                © 2026 <strong class="text-slate-900 font-semibold tracking-wide">Uptest, Ltd</strong>. All rights reserved.
            </p>
            
            <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
                <span class="font-light">Rebuilt by</span>
                <a href="https://æx7.com" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:text-brand-700 transition-colors font-semibold tracking-wide">
                    Æx7
                </a>
                [<a href="https://uptest.no" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:text-brand-700 transition-colors font-semibold tracking-wide">
                    Old version
                </a>]
            </div>
            
        </div>
    </footer>

    <!-- Skriptas mobiliam meniu -->
    <script>
        const mobileBtn = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu-panel');

        mobileBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
