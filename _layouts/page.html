{% assign data = site.data.data %}

<!DOCTYPE html>

<html lang="{{ page.lang }}" class="scroll-smooth">
    
<head>
    {% include head.html %}
</head>

<body class="bg-brand-950 text-slate-800 antialiased font-sans flex flex-col min-h-screen m-0">

    <!-- Įtraukiamas headeris -->

    {% include header.html %}

<!-- Subpage Hero / Ryškus Cyan Gradientas -->
<section class="relative bg-gradient-to-r from-brand-600 via-brand-500 to-brand-600 py-16 lg:py-20 text-white shadow-inner">
    <div class="relative z-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight drop-shadow-sm">
            {{ page.title }}
        </h1>
        {% if page.subtitle %}
        <p class="mt-4 text-lg sm:text-xl text-brand-50 font-normal max-w-2xl mx-auto">
            {{ page.subtitle }}
        </p>
        {% endif %}
    </div>
</section>

    <!-- Pagrindinio teksto sekcija -->
    <main class="flex-grow bg-white py-12 lg:py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 text-slate-700 leading-relaxed">
            {{ content }}

            {% if page.gallery_folder %}
                {% include gallery.html %}
            {% endif %}
        </div>
    </main>

   
    <!-- Footeris -->
    {% include footer.html %}
    
</body>
</html>
