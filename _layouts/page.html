{% assign data = site.data.data %}

<!DOCTYPE html>
<html lang="{{ page.lang }}" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ data.home.title.[page.lang] }}</title>

    <base href="/uptest.no/">
    
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="fonts.css">
    
    {% include tailwind.html %}
    
</head>
<body class="bg-brand-950 text-slate-800 antialiased font-sans flex flex-col min-h-[100svh]">

    {% include header.html %}

    <main class="flex-grow bg-white py-12 sm:py-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            {{ content }}
        </div>
    </main>

    {% include footer.html %}

    <script src="index.js"></script>
    
</body>
</html>
