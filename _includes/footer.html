{% assign t = site.data.data.common[page.lang] %}

<footer class="bg-zinc-100 py-4 sm:py-5 border-t border-gray-200 relative z-30 shadow-sm mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-4 text-center sm:text-left">
        
        <p class="text-[11px] text-slate-600 font-normal">
            © 2026 <strong class="text-slate-900 font-semibold tracking-wide">{{ t.company }}</strong>. {{ t.rights }}
        </p>
        
        <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
            <span class="font-light">{{ t.rebuilt_by }}</span>
            <a href="https://æx7.com" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:text-brand-700 transition-colors font-semibold tracking-wide">
                Æx7
            </a>
            [<a href="https://uptest.no" target="_blank" rel="noopener noreferrer" class="text-brand-600 hover:text-brand-700 transition-colors font-semibold tracking-wide">
                {{ t.old_version }}
            </a>]
        </div>
        
    </div>
</footer>
