{% assign c = site.data.data.common[page.lang] %}

<div class="bg-gradient-to-br from-brand-600 via-brand-600 to-brand-500 text-white rounded-2xl p-6 sm:p-8 space-y-4 shadow-lg shadow-brand-600/15 border border-brand-500 relative overflow-hidden">
    <h3 class="text-xl sm:text-2xl font-bold text-white tracking-tight">{{ include.title | default: c.get_in_touch }}</h3>
    <p class="text-brand-50 text-base leading-relaxed max-w-xl">
        {{ include.description }}
    </p>
    
{% assign n = site.data.data.nav %}

<div class="pt-2 flex flex-wrap items-center gap-3">
    <!-- Pagrindinis mygtukas (švelnesnis tamsus atspalvis) -->
    <a href="{{ site.baseurl }}/{{ n.contacts.link[page.lang] }}" class="inline-flex items-center justify-center px-6 py-3 rounded-xl font-bold text-sm text-white bg-brand-900 hover:bg-brand-800 shadow-md hover:shadow-lg transition-all">
        {{ include.btn_text | default: n.contacts.title[page.lang] }}
    </a>

    <!-- Kvadratinis telefono mygtukas -->
    <a href="tel:{{ c.phone }}" aria-label="Call us" class="w-11 h-11 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all border border-white/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
    </a>

    <!-- Kvadratinis el. pašto mygtukas -->
    <a href="mailto:{{ c.email }}" aria-label="Email us" class="w-11 h-11 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all border border-white/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
    </a>
</div>
    
</div>
