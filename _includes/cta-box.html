{% assign c = site.data.data.common[page.lang] %}

<div class="bg-gradient-to-br from-brand-600 via-brand-600 to-brand-500 text-white rounded-2xl p-6 sm:p-8 space-y-4 shadow-lg shadow-brand-600/15 border border-brand-500 relative overflow-hidden">
    <h3 class="text-xl sm:text-2xl font-bold text-white tracking-tight">{{ include.title | default: c.get_in_touch }}</h3>
    <p class="text-brand-50 text-base leading-relaxed max-w-xl">
        {{ include.description }}
    </p>
    
    <!-- Mygtukų šablonas įterpiamas čia -->
    {% include contact-buttons.html btn_text=include.btn_text %}
</div>
