<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptest | NDT rope access</title>
    
    <!-- Tailwind CSS (CDN for quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Optional: Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <!-- TOP BAR (Viršutinė juostelė) -->
    <div class="bg-blue-600 text-white text-sm py-2">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            
            <!-- Language Selector -->
            <div class="flex items-center space-x-3">
                <a href="/lt/" class="hover:opacity-80 transition-opacity">
                    <img src="https://www.uptest.no/wp-content/plugins/sitepress-multilingual-cms/res/flags/lt.png" alt="LT" class="w-5 h-3 shadow-sm rounded-sm">
                </a>
                <a href="/" class="hover:opacity-80 transition-opacity">
                    <img src="https://www.uptest.no/wp-content/plugins/sitepress-multilingual-cms/res/flags/en.png" alt="EN" class="w-5 h-3 shadow-sm rounded-sm ring-1 ring-white/50">
                </a>
            </div>

            <!-- Secondary Links -->
            <div class="hidden sm:flex space-x-6">
                <a href="/certificates/" class="hover:text-blue-200 transition-colors">Our certificates</a>
                <a href="/gallery/" class="hover:text-blue-200 transition-colors">Gallery</a>
                <a href="/lt/" class="hover:text-blue-200 transition-colors font-medium">Lietuviškai</a>
            </div>
            
        </div>
    </div>

    <!-- MAIN HEADER (Pagrindinė navigacija) -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="/">
                        <img class="h-12 w-auto object-contain" src="https://www.uptest.no/wp-content/uploads/2016/12/uptest-logo.png" alt="Uptest Logo">
                    </a>
                </div>

                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-8">
                    <a href="/about-us/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">About Us</a>
                    <a href="/non-destructive-testing/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">Non-Destructive Testing</a>
                    <a href="/rope-access/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">Rope Access</a>
                    <a href="/equipment/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">NDT equipment</a>
                    <a href="/career/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">Jobs & Careers</a>
                    <a href="/contacts/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors border-b-2 border-transparent hover:border-blue-600 pb-1">Contacts</a>
                </nav>

                <!-- Mobile Menu Button (Hamburger) -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" type="button" class="text-gray-500 hover:text-blue-600 focus:outline-none focus:text-blue-600 p-2">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
                
            </div>
        </div>

        <!-- Mobile Menu Panel (Hidden by default) -->
        <div id="mobile-menu-panel" class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg absolute w-full">
            <div class="px-4 pt-2 pb-4 space-y-1 sm:px-3">
                <a href="/about-us/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">About Us</a>
                <a href="/non-destructive-testing/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Non-Destructive Testing</a>
                <a href="/rope-access/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Rope Access</a>
                <a href="/equipment/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">NDT equipment</a>
                <a href="/career/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Jobs & Careers</a>
                <a href="/contacts/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-blue-600 hover:bg-gray-50">Contacts</a>
                
                <!-- Secondary links for mobile -->
                <div class="border-t border-gray-200 mt-4 pt-4 pb-2">
                    <a href="/certificates/" class="block px-3 py-2 text-sm text-gray-500 hover:text-blue-600">Our certificates</a>
                    <a href="/gallery/" class="block px-3 py-2 text-sm text-gray-500 hover:text-blue-600">Gallery</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Rest of your page content goes here... -->

    <!-- Simple script for mobile menu toggle -->
    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu-panel');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
